version: "3.9"

services:

  mongodb:
    image: mongo:7.0
    container_name: forensicai_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: forensicai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DB_NAME: forensicai
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data: